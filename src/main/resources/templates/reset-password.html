<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Jobify</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="/css/login-style.css" />
</head>

<body class="auth-page">

    <div class="auth-container">
        <!-- Left Side: Graphic / Branding -->
        <div class="auth-left position-relative">
            <div class="brand-header">
                <div class="logo-box">
                    <i class="fas fa-briefcase"></i>
                </div>
                <h2>Jobify</h2>
            </div>
            <div class="left-content">
                <h1 class="fw-bold mb-3">Set New Password</h1>
                <p class="mb-4">Enter your new password below. Make sure it's at least 6 characters long.</p>
            </div>
        </div>

        <!-- Right Side: Reset Form -->
        <div class="auth-right">
            <div class="auth-form-container">
                <div class="auth-form-header mb-4">
                    <h3>Create New Password</h3>
                    <p class="text-muted">Your new password must be different from previous used passwords.</p>
                </div>

                <!-- Messages -->
                <div th:if="${error}" class="alert alert-danger shadow-sm border-0 d-flex align-items-center" role="alert">
                    <i class="fas fa-exclamation-circle me-2"></i>
                    <div>
                        <strong>Error!</strong> <span th:text="${error}"></span>
                    </div>
                </div>
                <div th:if="${success}" class="alert alert-success shadow-sm border-0 d-flex align-items-center" role="alert">
                    <i class="fas fa-check-circle me-2"></i>
                    <div>
                        <strong>Success!</strong> <span th:text="${success}"></span>
                    </div>
                </div>

                <!-- Form only shows if token is valid (error is not present or we just show it anyway) -->
                <form th:if="${error == null or param.success != null}" th:action="@{/reset-password}" method="post" id="resetPasswordForm">
                    <input type="hidden" name="token" th:value="${token}" />
                    
                    <div class="form-group mb-3">
                        <label for="password">New Password</label>
                        <div class="password-toggle">
                            <input type="password" id="password" name="password" class="form-control"
                                placeholder="Enter new password" required minlength="6">
                            <button type="button" class="toggle-btn" onclick="togglePassword('password', this)">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="form-group mb-4">
                        <label for="confirmPassword">Confirm New Password</label>
                        <div class="password-toggle">
                            <input type="password" id="confirmPassword" name="confirmPassword" class="form-control"
                                placeholder="Confirm new password" required minlength="6">
                            <button type="button" class="toggle-btn" onclick="togglePassword('confirmPassword', this)">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="btn-auth-submit" id="submitBtn">Update Password</button>
                </form>

                <div class="auth-footer mt-4 text-center">
                    <p><a href="/login" class="fw-bold text-primary">Back to Login</a></p>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function togglePassword(inputId, btn) {
            const input = document.getElementById(inputId);
            const icon = btn.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        const form = document.getElementById('resetPasswordForm');
        if(form) {
            form.addEventListener('submit', function (e) {
                const pass = document.getElementById('password').value;
                const confirm = document.getElementById('confirmPassword').value;
                if (pass !== confirm) {
                    e.preventDefault();
                    alert('Passwords do not match!');
                    return;
                }
                const submitBtn = document.getElementById('submitBtn');
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Updating...';
            });
        }
    </script>
</body>
</html>

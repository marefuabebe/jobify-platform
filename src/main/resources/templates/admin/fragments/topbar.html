<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <header class="top-bar" th:fragment="topbar(pageTitle, pageSubtitle, iconClass)">
        <div class="d-flex align-items-center">
            <button class="btn btn-outline-secondary d-lg-none me-3" id="sidebarToggle" style="border-radius: 10px;">
                <i class="fas fa-bars"></i>
            </button>
            <div class="page-title d-flex align-items-center gap-3">
                <div class="title-icon">
                    <i th:class="${iconClass ?: 'fas fa-shield-alt'}"></i>
                </div>
                <div>
                    <h1 class="h4 fw-bold mb-0" th:text="${pageTitle}">Admin Section</h1>
                    <p class="text-muted small mb-0" th:text="${pageSubtitle}">Manage platform settings</p>
                </div>
            </div>
        </div>

        <div class="user-menu d-flex align-items-center gap-2">
            <!-- Theme Toggle -->
            <form th:action="@{/admin/theme/toggle}" method="post" class="d-inline">
                <button type="submit" class="btn btn-outline-secondary btn-sm d-flex align-items-center gap-1" style="border-radius: 999px; padding: 0.4rem 0.85rem;">
                    <i class="fas me-1" th:classappend="${session.theme == 'dark' ? 'fa-sun' : 'fa-moon'}"></i>
                    <span th:text="${session.theme == 'dark' ? 'Light' : 'Dark'}">Dark</span>
                </button>
            </form>

            <!-- Notification Bell Dropdown -->
            <div class="dropdown d-inline-block">
                <a href="#" class="btn btn-outline-secondary btn-sm position-relative d-flex align-items-center justify-content-center"
                   id="adminNotificationDropdownShared" data-bs-toggle="dropdown" aria-expanded="false"
                   style="width: 36px; height: 36px; border-radius: 50%;">
                    <i class="fas fa-bell"></i>
                    <span th:if="${adminUnreadCount != null and adminUnreadCount > 0}"
                          class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
                          style="font-size: 0.65rem;"
                          th:text="${adminUnreadCount}">1</span>
                </a>
                <div class="dropdown-menu dropdown-menu-end shadow-lg border-0 p-0" aria-labelledby="adminNotificationDropdownShared" style="width: 320px; max-height: 400px; overflow-y: auto; border-radius: 14px; z-index: 1050;">
                    <div class="p-3 border-bottom d-flex justify-content-between align-items-center" style="background: rgba(var(--primary-rgb), 0.06);">
                        <h6 class="mb-0 fw-bold"><i class="fas fa-bell me-2 text-primary"></i>Notifications</h6>
                        <span th:if="${adminUnreadCount != null and adminUnreadCount > 0}" class="badge bg-primary rounded-pill" th:text="${adminUnreadCount} + ' unread'">1 unread</span>
                    </div>
                    <div th:if="${adminRecentNotifications == null or adminRecentNotifications.isEmpty()}" class="p-4 text-center text-muted">
                        <i class="fas fa-check-circle fa-2x mb-2 text-success opacity-50"></i>
                        <p class="mb-0 small">No new notifications</p>
                    </div>
                    <div th:each="notif : ${adminRecentNotifications}" class="p-3 border-bottom text-dark" style="font-size: 0.85rem;" th:styleappend="${!notif.isRead ? 'background: rgba(var(--primary-rgb), 0.04);' : ''}">
                        <div class="d-flex justify-content-between align-items-start mb-1">
                            <strong class="text-truncate me-2" style="max-width: 190px;" th:text="${notif.title}">Title</strong>
                            <small class="text-muted" th:text="${#dates.format(notif.createdAt, 'MMM d, HH:mm')}">Date</small>
                        </div>
                        <p class="mb-1 text-muted" th:text="${notif.message}">Message</p>
                        <a th:if="${notif.type == 'VERIFICATION'}" href="/admin/verification-dashboard" class="small text-primary fw-bold text-decoration-none">Go to Verifications &rarr;</a>
                        <a th:if="${notif.type == 'DISPUTE'}" href="/admin/disputes" class="small text-danger fw-bold text-decoration-none">Review Dispute &rarr;</a>
                    </div>
                    <div class="p-2 text-center" style="background: rgba(0, 0, 0, 0.02);">
                        <a href="/notifications" class="small text-muted text-decoration-none">View All Notifications</a>
                    </div>
                </div>
            </div>

            <!-- Profile / Logout Action -->
            <a href="/admin/profile" class="btn btn-outline-secondary btn-sm d-none d-sm-inline-flex align-items-center gap-1" style="border-radius: 999px; padding: 0.4rem 0.85rem;" title="Admin Profile">
                <i class="fas fa-user-shield"></i>
                <span>Profile</span>
            </a>
            <a href="/logout" class="btn-pill btn-pill-sm text-white" style="background: var(--primary); text-decoration: none;">
                <i class="fas fa-sign-out-alt"></i>
                <span>Logout</span>
            </a>
        </div>
    </header>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Profile - Jobify</title>
    <link th:href="@{/webjars/bootstrap/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/webjars/font-awesome/css/all.min.css}" rel="stylesheet">
    <link th:href="@{/css/admin-styles.css}" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        .profile-hero {
            background: linear-gradient(135deg, rgba(var(--primary-rgb), 0.95) 0%, #047a4e 100%);
            border-radius: var(--radius);
            padding: 2.5rem 2rem 4rem;
            position: relative;
            color: #ffffff;
            box-shadow: 0 8px 30px rgba(5, 152, 98, 0.2);
            overflow: hidden;
        }
        .profile-hero::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -10%;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, transparent 70%);
            border-radius: 50%;
        }
        .profile-avatar-wrapper {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            position: relative;
            margin-top: -55px;
            margin-bottom: 1rem;
            border: 4px solid var(--bg-card);
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
            background: var(--bg-card);
        }
        .profile-avatar-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }
        .profile-camera-btn {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: var(--primary);
            color: #ffffff;
            border: 2px solid var(--bg-card);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .profile-camera-btn:hover {
            transform: scale(1.1);
            background: var(--primary-light);
        }
        .info-pill-item {
            background: var(--bg-light);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1rem 1.25rem;
            margin-bottom: 1rem;
        }
    </style>
</head>

<body th:classappend="${session.theme == 'dark' ? 'dark-theme' : 'light-theme'}">

    <!-- Standard Admin Sidebar -->
    <aside class="admin-sidebar" id="sidebar" th:replace="~{admin/fragments/sidebar :: sidebar(activeLink='profile')}">
    </aside>

    <!-- Mobile Sidebar Overlay -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- Main Content -->
    <main class="admin-main">
        <!-- Reusable Admin Topbar -->
        <header th:replace="~{admin/fragments/topbar :: topbar('Admin Profile', 'Manage administrator credentials, profile avatar, and security preferences', 'fas fa-user-shield')}">
        </header>

        <div class="container-fluid px-0">

            <!-- Alerts -->
            <div th:if="${success}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert" style="border-radius: 12px;">
                <i class="fas fa-check-circle me-2"></i><span th:text="${success}">Success</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert" style="border-radius: 12px;">
                <i class="fas fa-exclamation-circle me-2"></i><span th:text="${error}">Error</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <!-- Profile Hero Banner -->
            <div class="profile-hero mb-4">
                <div class="d-flex align-items-center justify-content-between">
                    <div>
                        <span class="badge bg-white text-dark rounded-pill px-3 py-1 fw-bold mb-2">Jobify Administration</span>
                        <h2 class="fw-bold mb-1">Executive Administrator</h2>
                        <p class="text-white-50 mb-0">System Superuser &amp; Platform Controller</p>
                    </div>
                    <div class="d-none d-md-block opacity-75">
                        <i class="fas fa-shield-alt fa-4x"></i>
                    </div>
                </div>
            </div>

            <!-- Profile Card -->
            <div class="card border-0 shadow-sm mb-4" style="background: var(--bg-card); border-radius: var(--radius); overflow: hidden;">
                <div class="card-body p-4 pt-0">

                    <div class="d-flex flex-wrap justify-content-between align-items-end mb-4">
                        <div class="d-flex flex-column align-items-start">
                            <div class="profile-avatar-wrapper">
                                <img th:if="${user.photos == null}" th:src="@{/images/user.png}" class="profile-avatar-img" alt="Admin Avatar">
                                <img th:if="${user.photos != null}" th:src="@{${user.photosImagePath}}" class="profile-avatar-img" alt="Admin Avatar">
                                <button class="profile-camera-btn" onclick="document.getElementById('profilePicInput').click()" title="Change Avatar">
                                    <i class="fas fa-camera"></i>
                                </button>
                                <form th:action="@{/admin/profile/pic}" method="post" enctype="multipart/form-data" id="avatarForm">
                                    <input type="file" name="image" id="profilePicInput" style="display: none;"
                                        accept="image/png, image/jpeg" onchange="document.getElementById('avatarForm').submit()">
                                </form>
                            </div>
                            <h4 class="fw-bold mb-1" th:text="${user != null ? user.email : 'admin@jobify.com'}">admin@jobify.com</h4>
                            <div class="d-flex align-items-center gap-2">
                                <span class="badge badge-soft-success rounded-pill px-3 py-1 fw-semibold">
                                    <i class="fas fa-check-circle me-1"></i> Active Superuser
                                </span>
                                <span class="text-muted small">ID #<span th:text="${user != null ? user.userId : '1'}">1</span></span>
                            </div>
                        </div>

                        <div class="mt-3 mt-md-0">
                            <a href="/logout" class="btn btn-outline-danger btn-pill">
                                <i class="fas fa-sign-out-alt me-1"></i> Sign Out
                            </a>
                        </div>
                    </div>

                    <div class="row g-4">
                        <!-- Account Details -->
                        <div class="col-lg-6">
                            <div class="card h-100 border-0 shadow-sm" style="background: var(--bg-light); border-radius: 14px;">
                                <div class="card-header bg-transparent border-0 pt-4 px-4 pb-0">
                                    <h5 class="fw-bold mb-0 text-primary">
                                        <i class="fas fa-user-circle me-2"></i> Account Information
                                    </h5>
                                </div>
                                <div class="card-body p-4">
                                    <div class="info-pill-item">
                                        <label class="small text-muted fw-bold text-uppercase d-block mb-1">Email Address</label>
                                        <div class="d-flex align-items-center gap-2 text-dark fw-semibold">
                                            <i class="fas fa-envelope text-primary"></i>
                                            <span th:text="${user.email}">admin@jobify.com</span>
                                        </div>
                                    </div>

                                    <div class="info-pill-item">
                                        <label class="small text-muted fw-bold text-uppercase d-block mb-1">Assigned Role</label>
                                        <div class="d-flex align-items-center gap-2 text-dark fw-semibold">
                                            <i class="fas fa-user-shield text-success"></i>
                                            <span>Full Administrator (Root Level)</span>
                                        </div>
                                    </div>

                                    <div class="info-pill-item mb-0">
                                        <label class="small text-muted fw-bold text-uppercase d-block mb-1">System Permissions</label>
                                        <div class="d-flex align-items-center gap-2 text-dark fw-semibold">
                                            <i class="fas fa-lock-open text-warning"></i>
                                            <span>Users, Verifications, Escrow, Moderation</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Password Update -->
                        <div class="col-lg-6">
                            <div class="card h-100 border-0 shadow-sm" style="background: var(--bg-light); border-radius: 14px;">
                                <div class="card-header bg-transparent border-0 pt-4 px-4 pb-0">
                                    <h5 class="fw-bold mb-0 text-danger">
                                        <i class="fas fa-shield-alt me-2"></i> Update Password
                                    </h5>
                                </div>
                                <div class="card-body p-4">
                                    <form th:action="@{/admin/profile/password}" method="post">
                                        <div class="mb-3">
                                            <label class="form-label small fw-bold text-muted text-uppercase">Current Password</label>
                                            <div class="input-group">
                                                <span class="input-group-text bg-white border-0"><i class="fas fa-lock text-muted"></i></span>
                                                <input type="password" name="currentPassword" class="form-control bg-white border-0" required
                                                    placeholder="Enter your current password">
                                            </div>
                                        </div>
                                        <div class="mb-3">
                                            <label class="form-label small fw-bold text-muted text-uppercase">New Password</label>
                                            <div class="input-group">
                                                <span class="input-group-text bg-white border-0"><i class="fas fa-key text-muted"></i></span>
                                                <input type="password" name="newPassword" class="form-control bg-white border-0" required
                                                    placeholder="Enter at least 8 characters">
                                            </div>
                                        </div>
                                        <div class="mb-4">
                                            <label class="form-label small fw-bold text-muted text-uppercase">Confirm New Password</label>
                                            <div class="input-group">
                                                <span class="input-group-text bg-white border-0"><i class="fas fa-check text-muted"></i></span>
                                                <input type="password" name="confirmPassword" class="form-control bg-white border-0" required
                                                    placeholder="Re-enter new password">
                                            </div>
                                        </div>
                                        <button type="submit" class="btn btn-primary btn-pill w-100 justify-content-center">
                                            <i class="fas fa-save me-1"></i> Save New Password
                                        </button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>
            </div>

        </div>
    </main>

    <script th:src="@{/webjars/jquery/jquery.min.js}"></script>
    <script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/js/admin-scripts.js}"></script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testimonials - Admin Dashboard - Jobify</title>
    <link th:href="@{/webjars/bootstrap/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/webjars/font-awesome/css/all.min.css}" rel="stylesheet">
    <link th:href="@{/css/admin-styles.css}" rel="stylesheet">
    <style>
        .section-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }
    </style>
</head>

<body th:classappend="${session.theme == 'dark' ? 'dark-theme' : 'light-theme'}">
    <aside class="admin-sidebar" id="sidebar" th:replace="~{admin/fragments/sidebar :: sidebar(activeLink='testimonials')}">
        <!-- Replaced by sidebar fragment -->
    </aside>

    <main class="admin-main">
        <div class="top-bar">
            <div class="page-title">
                <div class="title-icon">
                    <i class="fas fa-quote-left"></i>
                </div>
                <div>
                    <h1>Testimonials</h1>
                    <p class="mb-0">Manage customer reviews and feedback.</p>
                </div>
            </div>

            <div class="d-flex align-items-center gap-2">
                <form th:action="@{/admin/theme/toggle}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-outline-secondary btn-sm">
                        <i class="fas me-1"
                            th:classappend="${session.theme == 'dark' ? 'fa-sun' : 'fa-moon'}"></i>
                        <span th:text="${session.theme == 'dark' ? 'Light' : 'Dark'}">Dark</span>
                    </button>
                </form>
                <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#addTestimonialModal">
                    <i class="fas fa-plus me-2"></i>Add New
                </button>
            </div>
        </div>

        <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="fas fa-check-circle me-2"></i><span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="fas fa-exclamation-circle me-2"></i><span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div class="section-card">
            <div class="table-responsive">
                <table class="table admin-table mb-0">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Role</th>
                            <th>Rating</th>
                            <th>Message</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="t : ${testimonials}">
                            <td><span th:text="${t.name}" class="fw-semibold">Name</span></td>
                            <td th:text="${t.role}">Role</td>
                            <td>
                                <span class="text-warning">
                                    <i class="fas fa-star" th:each="i : ${#numbers.sequence(1, t.rating)}"></i>
                                </span>
                            </td>
                            <td><span th:text="${#strings.abbreviate(t.message, 70)}" class="text-muted">Message</span></td>
                            <td>
                                <form th:action="@{/admin/testimonials/delete/{id}(id=${t.id})}" method="post"
                                    class="d-inline" onsubmit="return confirm('Are you sure you want to delete this testimonial?');">
                                    <button type="button" class="btn btn-sm btn-info me-2 text-white" th:data-id="${t.id}"
                                        th:data-name="${t.name}" th:data-role="${t.role}" th:data-rating="${t.rating}"
                                        th:data-message="${t.message}" onclick="editTestimonial(this)">
                                        <i class="fas fa-edit"></i>
                                    </button>
                                    <button type="submit" class="btn btn-sm btn-danger">
                                        <i class="fas fa-trash"></i>
                                    </button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${testimonials.empty}">
                            <td colspan="5" class="text-center py-4 text-muted">No testimonials found. Add your first one!</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <div class="modal fade" id="addTestimonialModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Add Testimonial</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form th:action="@{/admin/testimonials/add}" method="post" enctype="multipart/form-data" id="testimonialForm">
                        <input type="hidden" name="id" id="testimonialId">
                        <div class="mb-3">
                            <label class="form-label">Client Name</label>
                            <input type="text" class="form-control" name="name" required placeholder="e.g. John Doe">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Role / Company</label>
                            <input type="text" class="form-control" name="role" required placeholder="e.g. CEO, TechStart">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Rating (1-5)</label>
                            <select class="form-select" name="rating" required>
                                <option value="5" selected>5 Stars</option>
                                <option value="4">4 Stars</option>
                                <option value="3">3 Stars</option>
                                <option value="2">2 Stars</option>
                                <option value="1">1 Star</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Message</label>
                            <textarea class="form-control" name="message" rows="3" required
                                placeholder="What did they say?"></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Client Photo (Optional)</label>
                            <input type="file" class="form-control" name="image" accept="image/*">
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-success">Save Testimonial</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script th:src="@{/webjars/jquery/jquery.min.js}"></script>
    <script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <script>
        function editTestimonial(btn) {
            // Get data from button attributes
            const id = btn.getAttribute('data-id');
            const name = btn.getAttribute('data-name');
            const role = btn.getAttribute('data-role');
            const rating = btn.getAttribute('data-rating');
            const message = btn.getAttribute('data-message');

            // Populate modal fields
            document.getElementById('testimonialId').value = id;
            document.querySelector('input[name="name"]').value = name;
            document.querySelector('input[name="role"]').value = role;
            document.querySelector('select[name="rating"]').value = rating;
            document.querySelector('textarea[name="message"]').value = message;

            // Change modal title and button text
            document.querySelector('.modal-title').textContent = 'Edit Testimonial';
            document.querySelector('button[type="submit"]').textContent = 'Update Testimonial';

            // Show modal
            const modal = new bootstrap.Modal(document.getElementById('addTestimonialModal'));
            modal.show();
        }

        // Reset form when modal is closed
        document.getElementById('addTestimonialModal').addEventListener('hidden.bs.modal', function () {
            document.getElementById('testimonialForm').reset();
            document.getElementById('testimonialId').value = '';
            document.querySelector('.modal-title').textContent = 'Add Testimonial';
            document.querySelector('button[type="submit"]').textContent = 'Save Testimonial';
        });
    </script>
</body>

</html>

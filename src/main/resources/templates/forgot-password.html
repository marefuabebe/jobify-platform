<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Jobify</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="/css/login-style.css" />
</head>

<body class="auth-page">

    <div class="auth-container">
        <!-- Left Side: Graphic / Branding -->
        <div class="auth-left position-relative">
            <div class="brand-header">
                <div class="logo-box">
                    <i class="fas fa-briefcase"></i>
                </div>
                <h2>Jobify</h2>
            </div>
            <div class="left-content">
                <h1 class="fw-bold mb-3">Reset your password</h1>
                <p class="mb-4">Enter your email address and we'll send you a link to reset your password.</p>
            </div>
        </div>

        <!-- Right Side: Reset Form -->
        <div class="auth-right">
            <div class="auth-form-container">
                <div class="auth-form-header mb-4">
                    <h3>Forgot Password</h3>
                    <p class="text-muted">Enter the email associated with your account.</p>
                </div>

                <!-- Messages -->
                <div th:if="${error}" class="alert alert-danger shadow-sm border-0 d-flex align-items-center" role="alert">
                    <i class="fas fa-exclamation-circle me-2"></i>
                    <div>
                        <strong>Error!</strong> <span th:text="${error}"></span>
                    </div>
                </div>
                <div th:if="${success}" class="alert alert-success shadow-sm border-0 d-flex align-items-center" role="alert">
                    <i class="fas fa-check-circle me-2"></i>
                    <div>
                        <strong>Success!</strong> <span th:text="${success}"></span>
                    </div>
                </div>

                <form th:action="@{/forgot-password}" method="post" id="forgotPasswordForm">
                    <!-- Dynamic CSRF Token injected by Thymeleaf -->
                    <div class="form-group mb-4">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" class="form-control"
                            placeholder="Enter your email" required autofocus>
                    </div>

                    <button type="submit" class="btn-auth-submit" id="submitBtn">Send Reset Link</button>
                </form>

                <div class="auth-footer mt-4 text-center">
                    <p>Remembered your password? <a href="/login" class="fw-bold text-primary">Back to Login</a></p>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('forgotPasswordForm').addEventListener('submit', function () {
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending...';
        });
    </script>
</body>
</html>
